<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cropt · Šećerna repa EVI Monitor · Srbija</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#ecf0f3;color:#222;height:100vh;display:flex;flex-direction:column;overflow:hidden}

#hdr{background:#1a2b2b;color:#fff;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative;z-index:1000;box-shadow:0 2px 8px rgba(0,0,0,.35);flex-shrink:0}
#hdr h1{font-size:1rem;font-weight:700;white-space:nowrap}
#hdr h1 em{font-style:normal;color:#87d23c}
.cg{display:flex;align-items:center;gap:5px}
.cl{font-size:.7rem;color:#7ecfc0;text-transform:uppercase;letter-spacing:.4px}
.tbtn{display:flex}
.tbtn button{background:#1f4040;color:#d4ecea;border:1px solid #2d5e5e;padding:4px 9px;font-size:.78rem;cursor:pointer;border-right:none;transition:background .15s}
.tbtn button:first-child{border-radius:4px 0 0 4px}
.tbtn button:last-child{border-radius:0 4px 4px 0;border-right:1px solid #3d6d9a}
.tbtn button:hover{background:#2a5c5c}
.tbtn button.active{background:#0f7878;color:#fff}
#diff-btn{margin-left:auto;background:#1f4040;color:#d4ecea;border:1px solid #2d5e5e;border-radius:4px;padding:4px 10px;font-size:.78rem;cursor:pointer}
#diff-btn:hover{background:#2a5c5c}
#lbl-btn:hover{background:#2a5c5c}
#lbl-btn.open{background:#0f7878;color:#fff}
#diff-btn.open{background:#0f7878;color:#fff}

#wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;gap:0;padding:3px}
#row{display:flex;flex:1;gap:3px;min-height:80px}
#resizer{display:none;height:6px;background:#c8d4e0;cursor:row-resize;flex-shrink:0;border-radius:3px;margin:2px 0;position:relative;transition:background .15s}
#resizer:hover,#resizer.active{background:#4a90c8}
#resizer::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:36px;height:4px;border-top:1px solid #aaa;border-bottom:1px solid #aaa}

.panel{flex:1;display:flex;flex-direction:column;background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,.1);min-width:0}
.phdr{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#f4f6f9;border-bottom:1px solid #dde2ea;flex-shrink:0}
.plabel{font-size:.7rem;font-weight:700;color:#6a7d95;text-transform:uppercase;letter-spacing:.4px}
.dsel{background:#fff;border:1px solid #c4cdd9;border-radius:4px;padding:3px 6px;font-size:.8rem;color:#333;cursor:pointer}
.mapwrap{flex:1;position:relative;min-height:0}
.mapwrap>div[id]{height:100%;width:100%}

#diff-panel{display:none;flex-direction:column;background:#fff;border-radius:6px;box-shadow:0 1px 5px rgba(0,0,0,.1);overflow:hidden;flex-shrink:0;min-height:80px}
#diff-panel.open{display:flex;height:35vh}

.legend{background:rgba(255,255,255,.93);border-radius:5px;padding:7px 10px;font-size:.68rem;box-shadow:0 1px 5px rgba(0,0,0,.18);pointer-events:none!important;backdrop-filter:blur(2px)}
.ltitle{font-weight:700;color:#333;margin-bottom:4px;font-size:.7rem}
.li{display:flex;align-items:center;gap:5px;margin:2px 0}
.ls{width:18px;height:10px;border-radius:2px;flex-shrink:0;border:1px solid rgba(0,0,0,.08)}

.mlbl{pointer-events:none;background:none;border:none;text-align:center;white-space:nowrap}
.mlbl .mn{display:block;font-size:11px;font-weight:700;color:#111;line-height:1.2;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 4px #fff,0 0 4px #fff}
.mlbl .mv{display:block;font-size:13px;font-weight:800;line-height:1.1;text-shadow:0 0 4px #fff,0 0 4px #fff,0 0 4px #fff,0 0 4px #fff}
.mlbl .mv.bad{color:#b52b2b}
.mlbl .mv.ok{color:#1a7a35}
.mlbl .mv.warn{color:#b56000}
.mlbl .mv.nd{color:#999}

.leaflet-tooltip.mtt{padding:8px 10px;border-radius:5px;border:none;box-shadow:0 2px 8px rgba(0,0,0,.18);font-size:.78rem;max-width:240px}
.mtt h4{color:#1a2b2b;margin-bottom:5px;font-size:.82rem}
.mtt table{border-collapse:collapse;width:100%}
.mtt td{padding:2px 4px}
.mtt td:first-child{color:#666}
.mtt td:last-child{font-weight:700;text-align:right}
.mtt .note{font-size:.65rem;color:#999;margin-top:3px}
.mtt .bsub{font-size:.68rem;color:#666;margin-top:4px;border-top:1px solid #eee;padding-top:3px}

#credit{position:fixed;bottom:4px;left:50%;transform:translateX(-50%);font-size:.62rem;color:#aaa;pointer-events:none;z-index:9999}
#credit a{color:#87d23c;pointer-events:all}
</style>
</head>

const MIDS = [.05,.15,.25,.35,.45,.55,.65,.75,.85,.95];

function calcRows(muniData, irr) {
  const rows = [];
  if (irr==='all'){if(muniData.irrigated)rows.push(muniData.irrigated);if(muniData.non_irrigated)rows.push(muniData.non_irrigated);}
  else {if(muniData[irr])rows.push(muniData[irr]);}
  return rows;
}

function addRows(acc, rows) {
  rows.forEach(r=>{r.c.forEach((v,i)=>acc.c[i]+=v);acc.cloud+=r.cloud;});
}

function computeAcc(acc) {
  const total = acc.c.reduce((a,b)=>a+b,0);
  if (!total) return null;
  const bad = acc.c[0]+acc.c[1]+acc.c[2]+acc.c[3];
  const avgEVI = acc.c.reduce((s,v,i)=>s+v*MIDS[i],0)/total;
  return {c:acc.c, cloud:acc.cloud, total, bad, pct:bad/total*100, avgEVI};
}

function getMetrics(csvKeys, date, ds, irr) {
  const acc = {c:Array(10).fill(0), cloud:0};
  let any = false;
  for (const key of csvKeys) {
    const d = EVI_DATA[date]?.[ds]?.[key];
    if (!d) continue;
    const rows = calcRows(d, irr);
    if (rows.length) {addRows(acc, rows); any=true;}
  }
  return any ? computeAcc(acc) : null;
}

function hexRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function rgbHex(r,g,b){return'#'+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join('')}
function lerp(a,b,t){return a+(b-a)*t}

function gradColor(v,stops){
  const n=stops.length;
  if(v<=stops[0][0])return stops[0][1];
  if(v>=stops[n-1][0])return stops[n-1][1];
  for(let i=0;i<n-1;i++){
    const[v0,c0]=stops[i],[v1,c1]=stops[i+1];
    if(v<=v1){const t=(v-v0)/(v1-v0);const[r0,g0,b0]=hexRgb(c0),[r1,g1,b1]=hexRgb(c1);return rgbHex(lerp(r0,r1,t),lerp(g0,g1,t),lerp(b0,b1,t));}
  }
}

const GR_MAIN=[[0,'#1a9641'],[20,'#a6d96a'],[40,'#ffffbf'],[60,'#fdae61'],[80,'#f46d43'],[100,'#d7191c']];
const GR_DIFF=[[-60,'#c7e9c0'],[-15,'#74c476'],[0,'#238b45'],[10,'#ffffb2'],[30,'#fdae61'],[55,'#f46d43'],[85,'#d7191c']];

function mainColor(pct){return gradColor(pct,GR_MAIN);}
function diffColor(d){return gradColor(d,GR_DIFF);}

function mkMap(id){
  const m=L.map(id,{center:[44.5,20.5],zoom:7,zoomSnap:.5,maxBounds:[[39,16],[48,26]]});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CartoDB',subdomains:'abcd',maxZoom:15}).addTo(m);
  return m;
}

function mkLegend(map,pos='bottomright'){
  const ctrl=L.control({position:pos});
  ctrl.onAdd=function(){
    const d=L.DomUtil.create('div','legend');
    L.DomEvent.disableClickPropagation(d);
    L.DomEvent.disableScrollPropagation(d);
    return d;
  };
  ctrl.addTo(map);
  return ctrl;
}

function syncMaps(src,targets){
  src.on('moveend',()=>{if(syncing)return;syncing=true;const c=src.getCenter(),z=src.getZoom();targets.forEach(t=>t.setView(c,z,{animate:false}));syncing=false;});
}

// ============================================================
// TOOLTIP HELPERS
// ============================================================
function fmtHa(v){return v>=100?v.toFixed(0):v>=10?v.toFixed(1):v.toFixed(2)}
function sign(v){return (v>0?'+':'')+v.toFixed(1)}

function muniLabel(feat){
  const keys=feat.properties._csvKeys;
  if(keys.length>1) return 'Beograd';
  return keys[0].replace(' (BEOGRAD)','');
}

function mainTip(feat,date,ds,irr){
  const keys=feat.properties._csvKeys, label=muniLabel(feat);
  const m=getMetrics(keys,date,ds,irr);
  if(!m) return `<div class="mtt"><h4>${label}</h4><p style="color:#999">${t('tipNoData')}</p></div>`;
  const col=m.pct>60?'#b52b2b':m.pct>30?'#b56000':'#1a7a35';
  let sub='';
  if(keys.length>1){
    sub=`<div class="bsub"><b>${t('tipBelgrade')}</b><br>`;
    keys.forEach(k=>{
      const km=getMetrics([k],date,ds,irr);
      if(km) sub+=`${k.replace(' (BEOGRAD)','')} — ${km.pct.toFixed(1)}%<br>`;
    });
    sub+='</div>';
  }
  return `<div class="mtt"><h4>${label}</h4>
    <table>
      <tr><td>${t('tipBadEvi')}</td><td style="color:${col}">${m.pct.toFixed(1)}%</td></tr>
      <tr><td>${t('tipBadHa')}</td><td>${fmtHa(m.bad)}</td></tr>
      <tr><td>${t('tipTotalHa')}</td><td>${fmtHa(m.total)}</td></tr>
      <tr><td>${t('tipAvgEvi')}</td><td>${m.avgEVI.toFixed(3)}</td></tr>
      ${m.cloud>.1?`<tr><td style="color:#999">${t('tipCloudHa')}</td><td style="color:#999">${fmtHa(m.cloud)}</td></tr>`:''}
    </table>
    ${m.cloud>.1?`<div class="note">${t('tipCloudNote')}</div>`:''}
    ${sub}</div>`;
}

function diffTip(feat,dL,dR,ds,irr){
  const keys=feat.properties._csvKeys, label=muniLabel(feat);
  const mL=getMetrics(keys,dL,ds,irr), mR=getMetrics(keys,dR,ds,irr);
  if(!mL||!mR) return `<div class="mtt"><h4>${label}</h4><p style="color:#999">${t('tipNoDataShort')}</p></div>`;
  const dPct=mR.pct-mL.pct, dHa=mR.bad-mL.bad, dEvi=mR.avgEVI-mL.avgEVI;
  const col=v=>v>2?'#b52b2b':v<-2?'#1a7a35':'#555';
  return `<div class="mtt"><h4>${label} <span style="color:#999;font-size:.68rem">${t('tipDiffLabel')}</span></h4>
    <table>
      <tr><td>${t('tipDPct')}</td><td style="color:${col(dPct)}">${sign(dPct)}%</td></tr>
      <tr><td>${t('tipDHa')}</td><td style="color:${col(dHa)}">${sign(dHa)} ha</td></tr>
      <tr><td>${t('tipDEvi')}</td><td style="color:${col(-dEvi)}">${sign(dEvi)}</td></tr>
    </table>
    <div class="note" style="margin-top:4px">A = ${DATE_LABELS[dL]}  B = ${DATE_LABELS[dR]}</div>
  </div>`;
}

// ============================================================
// STYLE FUNCTIONS
// ============================================================
function mainStyle(feat,date,ds,irr,met){
  const m=getMetrics(feat.properties._csvKeys,date,ds,irr);
  if(!m) return {fillColor:'#ebebeb',fillOpacity:.5,weight:.5,color:'#bbb',dashArray:'3'};
  const val=met==='pct'?m.pct:met==='ha'?m.bad/m.total*100:(1-m.avgEVI)*100;
  return {fillColor:mainColor(val),fillOpacity:.82,weight:.7,color:'#555',dashArray:null};
}

function diffStyle(feat,dL,dR,ds,irr,dmet){
  const mL=getMetrics(feat.properties._csvKeys,dL,ds,irr);
  const mR=getMetrics(feat.properties._csvKeys,dR,ds,irr);
  if(!mL||!mR) return {fillColor:'#ebebeb',fillOpacity:.4,weight:.5,color:'#bbb',dashArray:'3'};
  let delta;
  if(dmet==='dpct')     delta=mR.pct-mL.pct;
  else if(dmet==='dha') delta=(mR.bad-mL.bad)*0.4;
  else                  delta=-(mR.avgEVI-mL.avgEVI)*100;
  return {fillColor:diffColor(delta),fillOpacity:.82,weight:.7,color:'#555',dashArray:null};
}

// ============================================================
// LAYERS
// ============================================================
function buildLayer(map,styleFn,tipFn){
  let gjLayer;
  gjLayer=L.geoJSON(GEOJSON,{
    style:f=>styleFn(f),
    onEachFeature(f,layer){
      // Bind tooltip once; update content dynamically to avoid piling up
      layer.bindTooltip('',{sticky:true,className:'mtt',opacity:.97,permanent:false});
      layer.on({
        mouseover(e){
          if(!syncing) e.target.setStyle({weight:2,color:'#111',fillOpacity:.9});
          layer.getTooltip().setContent(tipFn(f));
          layer.openTooltip(e.latlng);
        },
        mousemove(e){layer.openTooltip(e.latlng);},
        // resetStyle must be called on the L.GeoJSON group (gjLayer), not the polygon layer
        mouseout(e){gjLayer.resetStyle(e.target);layer.closeTooltip();},
        click(e){map.fitBounds(e.target.getBounds().pad(.08));}
      });
    }
  }).addTo(map);
  return gjLayer;
}

// ============================================================
// LABELS
// ============================================================
function centroid(feat){
  let coords;
  if(feat.geometry.type==='Polygon') coords=feat.geometry.coordinates[0];
  else coords=feat.geometry.coordinates.reduce((a,b)=>b[0].length>a[0].length?b:a,[[[]]],feat.geometry.coordinates[0])[0];
  let la=0,lo=0;coords.forEach(([x,y])=>{lo+=x;la+=y;});
  return[la/coords.length,lo/coords.length];
}

function buildLabels(map,ll,date,ds,irr,met){
  ll.clearLayers();
  if(!S.labels) return;
  GEOJSON.features.forEach(f=>{
    const m=getMetrics(f.properties._csvKeys,date,ds,irr);
    const label=muniLabel(f);
    const short=label.length>14?label.slice(0,13)+'…':label;
    let vs='—',cls='nd';
    if(m){
      if(met==='pct'){vs=m.pct.toFixed(1)+'%';cls=m.pct>60?'bad':m.pct>30?'warn':'ok';}
      else if(met==='ha'){vs=fmtHa(m.bad)+'/'+fmtHa(m.total);cls=m.pct>60?'bad':m.pct>30?'warn':'ok';}
      else{vs=m.avgEVI.toFixed(2);cls=m.avgEVI<0.35?'bad':m.avgEVI<0.55?'warn':'ok';}
    }
    const icon=L.divIcon({html:`<div class="mlbl"><span class="mn">${short}</span><span class="mv ${cls}">${vs}</span></div>`,className:'',iconSize:[0,0],iconAnchor:[0,0]});
    try{L.marker(centroid(f),{icon,interactive:false}).addTo(ll);}catch(e){}
  });
}

function buildDiffLabels(map,ll,dL,dR,ds,irr,dmet){
  ll.clearLayers();
  if(!S.labels) return;
  GEOJSON.features.forEach(f=>{
    const mLm=getMetrics(f.properties._csvKeys,dL,ds,irr);
    const mRm=getMetrics(f.properties._csvKeys,dR,ds,irr);
    const label=muniLabel(f);
    const short=label.length>14?label.slice(0,13)+'…':label;
    let vs='—',cls='nd';
    if(mLm&&mRm){
      if(dmet==='dpct'){const d=mRm.pct-mLm.pct;vs=(d>=0?'+':'')+d.toFixed(1)+'%';cls=d>5?'bad':d<-5?'ok':'nd';}
      else if(dmet==='dha'){const d=(mRm.bad-mLm.bad)*0.4;vs=(d>=0?'+':'')+fmtHa(d);cls=d>0?'bad':d<0?'ok':'nd';}
      else{const d=mRm.avgEVI-mLm.avgEVI;vs=(d>=0?'+':'')+d.toFixed(2);cls=d<-0.05?'bad':d>0.05?'ok':'nd';}
    }
    const icon=L.divIcon({html:`<div class="mlbl"><span class="mn">${short}</span><span class="mv ${cls}">${vs}</span></div>`,className:'',iconSize:[0,0],iconAnchor:[0,0]});
    try{L.marker(centroid(f),{icon,interactive:false}).addTo(ll);}catch(e){}
  });
}

// ============================================================
// LEGENDS
// ============================================================
function mainLegend(el,met){
  if(met==='avgEvi'){
    const steps=[[0.8,1.0,'#1a9641','#a6d96a'],[0.6,0.8,'#a6d96a','#ffffbf'],[0.4,0.6,'#ffffbf','#fdae61'],[0.2,0.4,'#fdae61','#f46d43'],[0.0,0.2,'#f46d43','#d7191c']];
    el.innerHTML=`<div class="ltitle">Prosečan EVI</div>`+steps.map(([a,b,c0,c1])=>`<div class="li"><div class="ls" style="background:linear-gradient(90deg,${c0},${c1})"></div><span>${a.toFixed(1)}–${b.toFixed(1)}</span></div>`).join('')+`<div class="li"><div class="ls" style="background:#ebebeb;border:1px dashed #bbb"></div><span>${t('legendNoData')}</span></div>`;return;
  }
  const title=met==='pct'?t('legendBadEvi'):t('legendHaBad');
  const steps=[[0,20,'#1a9641','#a6d96a'],[20,40,'#a6d96a','#ffffbf'],[40,60,'#ffffbf','#fdae61'],[60,80,'#fdae61','#f46d43'],[80,100,'#f46d43','#d7191c']];
  el.innerHTML=`<div class="ltitle">${title}</div>`
    +steps.map(([a,b,c0,c1])=>`<div class="li"><div class="ls" style="background:linear-gradient(90deg,${c0},${c1})"></div><span>${a}–${b}%</span></div>`).join('')
    +`<div class="li"><div class="ls" style="background:#ebebeb;border:1px dashed #bbb"></div><span>${t('legendNoData')}</span></div>`;
}

function diffLegend(el,dmet){
  if(dmet==='devi'){
    // EVI diff: delta = -(mR.avgEVI-mL.avgEVI)*100, so /100 and negate for display
    const eviSteps=[[-0.4,-0.1,'#c7e9c0','#74c476'],[-0.1,0,'#74c476','#238b45'],[0,0.05,'#238b45','#ffffb2'],[0.05,0.15,'#ffffb2','#fdae61'],[0.15,0.30,'#fdae61','#f46d43'],[0.30,0.40,'#f46d43','#d7191c']];
    el.innerHTML=`<div class="ltitle">${t('dEvi')} (B−A)</div>`+eviSteps.map(([a,b,c0,c1])=>`<div class="li"><div class="ls" style="background:linear-gradient(90deg,${c0},${c1})"></div><span>${a>=0?'+':''}${a.toFixed(2)} → ${b>=0?'+':''}${b.toFixed(2)}</span></div>`).join('')+`<div class="li" style="font-size:.64rem;color:#666;margin-top:4px">${t('legendBetter')} &nbsp; ${t('legendWorse')}</div>`;return;
  }
  const unit=dmet==='dha'?' ha':'%';
  const lbl=dmet==='dpct'?t('dPct')+' EVI':t('dHa');
  const steps=[[-60,-15,'#c7e9c0','#74c476'],[-15,0,'#74c476','#238b45'],[0,10,'#238b45','#ffffb2'],[10,30,'#ffffb2','#fdae61'],[30,55,'#fdae61','#f46d43'],[55,85,'#f46d43','#d7191c']];
  el.innerHTML=`<div class="ltitle">${lbl} (B−A)</div>`
    +steps.map(([a,b,c0,c1])=>`<div class="li"><div class="ls" style="background:linear-gradient(90deg,${c0},${c1})"></div><span>${a>0?'+':''}${a}${unit} → ${b>0?'+':''}${b}${unit}</span></div>`).join('')
    +`<div class="li" style="font-size:.64rem;color:#666;margin-top:4px">${t('legendBetter')} &nbsp; ${t('legendWorse')}</div>`;
}

// ============================================================
// STATS BAR
// ============================================================
function updateStats(elId,date,ds,irr){
  const el=document.getElementById(elId);
  let tb=0,ta=0,n=0;
  GEOJSON.features.forEach(f=>{
    const m=getMetrics(f.properties._csvKeys,date,ds,irr);
    if(!m)return;tb+=m.bad;ta+=m.total;n++;
  });
  el.innerHTML=ta?t('polyStats')(n,(tb/ta*100).toFixed(1),Math.round(tb).toLocaleString(),Math.round(ta).toLocaleString()):'';;
}

// ============================================================
// REFRESH
// ============================================================
function refreshMain(side){
  const{ds,irr,met}=S, date=S[side];
  const map=side==='L'?mL:mR;
  const gl=side==='L'?gL:gR, ll=side==='L'?llL:llR;
  if(gl) map.removeLayer(gl);
  const ng=buildLayer(map,f=>mainStyle(f,date,ds,irr,met),f=>mainTip(f,date,ds,irr));
  if(side==='L') gL=ng; else gR=ng;
  buildLabels(map,ll,date,ds,irr,met);
  mainLegend(side==='L'?legL.getContainer():legR.getContainer(),met);
  updateStats('stat-'+side,date,ds,irr);
}

function refreshDiff(){
  if(!S.diffOpen) return;
  const{ds,irr,L:dL,R:dR}=S;
  const dmet=S.met==='avgEvi'?'devi':S.met==='ha'?'dha':'dpct';
  if(gD) mD.removeLayer(gD);
  gD=buildLayer(mD,f=>diffStyle(f,dL,dR,ds,irr,dmet),f=>diffTip(f,dL,dR,ds,irr));
  if(llD) buildDiffLabels(mD,llD,dL,dR,ds,irr,dmet);
  diffLegend(legD.getContainer(),dmet);
  let better=0,worse=0,same=0;
  GEOJSON.features.forEach(f=>{
    const mLm=getMetrics(f.properties._csvKeys,dL,ds,irr);
    const mRm=getMetrics(f.properties._csvKeys,dR,ds,irr);
    if(!mLm||!mRm) return;
    const d=mRm.pct-mLm.pct;
    if(d<-1)better++;else if(d>1)worse++;else same++;
  });
  document.getElementById('stat-D').innerHTML=t('diffStats')(better,same,worse);
}

function refreshAll(){refreshMain('L');refreshMain('R');refreshDiff();}

// ============================================================
// UI WIRING
// ============================================================
function populateDates(){
  ['L','R'].forEach(side=>{
    const sel=document.getElementById('sel-'+side);
    DATES.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=DATE_LABELS[d]||d;sel.appendChild(o);});
    sel.value=S[side];
    sel.addEventListener('change',()=>{S[side]=sel.value;refreshMain(side);if(S.diffOpen)refreshDiff();});
  });
}

function wireToggle(id,key,cb){
  document.getElementById(id).querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.getElementById(id).querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');S[key]=btn.dataset.v;cb();
    });
  });
}

// ============================================================
// INIT
// ============================================================
function init(){
  mL=mkMap('map-L'); mR=mkMap('map-R'); mD=mkMap('map-D');
  legL=mkLegend(mL); legR=mkLegend(mR); legD=mkLegend(mD);
  syncMaps(mL,[mR,mD]); syncMaps(mR,[mL,mD]); syncMaps(mD,[mL,mR]);
  llL=L.layerGroup().addTo(mL);
  llR=L.layerGroup().addTo(mR);
  llD=L.layerGroup().addTo(mD);

  const diffBtn=document.getElementById('diff-btn');
  const diffPanel=document.getElementById('diff-panel');
  diffBtn.addEventListener('click',()=>{
    S.diffOpen=!S.diffOpen;
    diffPanel.classList.toggle('open',S.diffOpen);
    diffBtn.classList.toggle('open',S.diffOpen);
    diffBtn.innerHTML=S.diffOpen?t('hideDiff'):t('showDiff');
    const rz2=document.getElementById('resizer');
    if(!S.diffOpen){const row=document.getElementById('row');row.style.flex='1';row.style.height='';rz2.style.display='none';}
    else{rz2.style.display='block';}
    if(S.diffOpen) setTimeout(()=>{
      mD.invalidateSize();
      mD.setView(mL.getCenter(),mL.getZoom(),{animate:false});
      refreshDiff();
    },60);
  });

  populateDates();
  wireToggle('tg-ds','ds',refreshAll);
  wireToggle('tg-irr','irr',refreshAll);
  wireToggle('tg-met','met',()=>refreshAll());

  // Labels toggle
  const lblBtn=document.getElementById('lbl-btn');
  lblBtn.addEventListener('click',()=>{
    S.labels=!S.labels;
    lblBtn.classList.toggle('open',S.labels);
    [llL,llR,llD].forEach(ll=>{if(ll)ll.clearLayers();});
    if(S.labels) refreshAll();
  });

  // Language toggle
  document.getElementById('tg-lang').querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.getElementById('tg-lang').querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      setLang(btn.dataset.v);
    });
  });

  mL.fitBounds(SBOUNDS); mR.fitBounds(SBOUNDS); mD.fitBounds(SBOUNDS);
  applyLang();
  refreshAll();
}

// ============================================================
// RESIZABLE SPLITTER
// ============================================================
(function(){
  const rz=document.getElementById('resizer');
  const row=document.getElementById('row');
  const dp=document.getElementById('diff-panel');
  const wrap=document.getElementById('wrap');
  let dragging=false, startY=0, startRowH=0, startDpH=0;

  rz.addEventListener('mousedown',e=>{
    if(!S.diffOpen) return;
    dragging=true;
    startY=e.clientY;
    startRowH=row.getBoundingClientRect().height;
    startDpH=dp.getBoundingClientRect().height;
    rz.classList.add('active');
    document.body.style.cursor='row-resize';
    document.body.style.userSelect='none';
    e.preventDefault();
  });
  document.addEventListener('mousemove',e=>{
    if(!dragging) return;
    const dy=e.clientY-startY;
    const minH=80, wrapH=wrap.getBoundingClientRect().height;
    const newRowH=Math.max(minH, Math.min(wrapH-minH-6, startRowH+dy));
    const newDpH=Math.max(minH, wrapH-newRowH-6);
    row.style.flex='none';
    row.style.height=newRowH+'px';
    dp.style.height=newDpH+'px';
    [mL,mR,mD].forEach(m=>{try{m.invalidateSize();}catch(e){}});
  });
  document.addEventListener('mouseup',()=>{
    if(!dragging) return;
    dragging=false;
    rz.classList.remove('active');
    document.body.style.cursor='';
    document.body.style.userSelect='';
  });
})();


init();
</script>
